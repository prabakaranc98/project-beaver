name: ci

on:
  pull_request:
    # "edited" re-runs the title check when a PR is renamed
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Squash merge makes the PR title the commit on main, so the title
      # carries the Conventional Commits rule from docs/build-plan.md.
      - name: PR title follows Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|docs|test|chore)(\([a-z0-9-]+\))?!?: .+'; then
            echo "::error::PR title must start with feat:, fix:, docs:, test: or chore: (for example 'docs: write CHARTER.md'). Got: $TITLE"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest jsonschema

      - name: Validate example workspace
        run: |
          if [ -f tools/validate.py ]; then
            python tools/validate.py core/examples
          else
            echo "tools/validate.py not built yet (#27), skipping"
          fi

      # Beaver's own tests; a learner's fork carries them (the root is the
      # template) but has no reason to run them.
      - name: Unit and snapshot tests
        if: github.repository == 'prabakaranc98/project-beaver'
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "tests/ not created yet (#29), skipping"
          fi
